<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Glyphcast turns any image into text art in your browser, with optional colour.">
  <title>Glyphcast · Image to Text Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Glyph<span>cast</span></h1>
    <p>Turn any image into text art, entirely in your browser.</p>
  </header>

  <main class="layout">
    <section class="panel" aria-label="Input">
      <label id="dropzone" class="dropzone" for="file">
        <input id="file" type="file" accept="image/*" hidden>
        <strong>Drop an image here</strong>
        <span>or click to choose a file</span>
      </label>
      <p id="status" class="status" role="status">No image loaded yet.</p>

      <div class="field">
        <label for="width">Width <output id="widthValue">100</output> characters</label>
        <input id="width" type="range" min="20" max="200" value="100">
      </div>

      <div class="field">
        <label for="ramp">Character ramp</label>
        <select id="ramp">
          <option value="classic">Classic</option>
          <option value="minimal">Minimal</option>
          <option value="dense">Dense</option>
        </select>
      </div>

      <div class="toggles">
        <label><input id="invert" type="checkbox"> Invert (light backgrounds)</label>
        <label><input id="color" type="checkbox" checked> Colour</label>
      </div>

      <div class="actions">
        <button id="copy" type="button" class="btn primary">Copy text</button>
        <button id="download" type="button" class="btn">Download .txt</button>
      </div>
    </section>

    <section class="panel output" aria-label="Output">
      <pre id="output" class="art">Your text art will appear here.</pre>
    </section>
  </main>

  <footer class="footer">Glyphcast · MIT licensed · Images never leave your device.</footer>
  <script src="glyphcast.js"></script>
</body>
</html>
